name: Deploy to Ubuntu Server (Dev)

on:
  push:
    branches:
      - dev  # Change this to your actual development branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: dev  # Ensures it checks out the `dev` branch

      - name: Setup SSH Key
        run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /iwtDashboard/IOTADashboard  # Make sure this path is for `dev`
            git pull origin dev  # Ensure you're pulling the `dev` branch
            npm install  # Install dependencies if needed
            pm2 restart app  # Restart your Node.js application (modify if needed)
          EOF
