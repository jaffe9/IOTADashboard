name: Deploy to Ubuntu Server (Blue-Green)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: dev

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd /root/iwtDashboard

            # Determine which slot to use
            if [ "$(readlink IOTADashboard-active)" = "IOTADashboard-blue" ]; then
              NEXT="IOTADashboard-green"
              NEXT_PORT=8081
              APP_NAME="appDashboard-green"
            else
              NEXT="IOTADashboard-blue"
              NEXT_PORT=8080
              APP_NAME="appDashboard-blue"
            fi

            # Clean and clone fresh
            rm -rf $NEXT
            git clone https://github.com/jaffe9/IOTADashboard.git $NEXT
            cd $NEXT
            git checkout dev
            git pull origin dev
            npm install

            # ✅ Update only PORT line in .env file without affecting others
            awk -v PORT="$NEXT_PORT" 'BEGIN {updated=0} 
              /^PORT=/ {$0="PORT="PORT; updated=1} 
              {print} 
              END {if (!updated) print "PORT="PORT}' .env > .env.tmp && mv .env.tmp .env

            # ✅ Delete previous process if it exists
            pm2 delete $APP_NAME || true

            # ✅ Start app
            pm2 start ecosystem.config.cjs --only $APP_NAME

            # ✅ Wait a few seconds to ensure it's up
            sleep 5

            # ✅ Ensure app started successfully
            if ! netstat -tulpn | grep ":$NEXT_PORT" > /dev/null; then
              echo "❌ App failed to start on port $NEXT_PORT"
              exit 1
            fi

            # ✅ Update symlink to point to the new deployment
            ln -sfn /root/iwtDashboard/$NEXT /root/iwtDashboard/IOTADashboard-active

            # ✅ Switch backend port in nginx
            /usr/local/bin/switch_backend_port.sh
          EOF
