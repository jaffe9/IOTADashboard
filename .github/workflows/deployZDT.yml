name: Deploy to Ubuntu Server (Blue-Green)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: dev

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd /root/iwtDashboard

            # Determine which slot to use
            if [ "$(readlink IOTADashboard-active)" = "IOTADashboard-blue" ]; then
              NEXT="IOTADashboard-green"
              NEXT_PORT=8081
              APP_NAME="appDashboard-green"
            else
              NEXT="IOTADashboard-blue"
              NEXT_PORT=8080
              APP_NAME="appDashboard-blue"
            fi

            # Remove old green/blue and clone new
            rm -rf $NEXT
            git clone https://github.com/jaffe9/IOTADashboard.git $NEXT
            cd $NEXT
            git checkout dev
            git pull origin dev
            npm install

            # Set the correct port in .env
            [ -f .env ] && sed -i "s/^PORT=.*/PORT=$NEXT_PORT/" .env || echo "PORT=$NEXT_PORT" > .env

            # Start the correct app
            pm2 startOrReload ecosystem.config.cjs --only $APP_NAME
            pm2 logs $APP_NAME --lines 50

            # Update symlink
            ln -sfn /root/iwtDashboard/$NEXT /root/iwtDashboard/IOTADashboard-active

            # Trigger port switch in nginx
            /usr/local/bin/switch_backend_port.sh
          EOF
