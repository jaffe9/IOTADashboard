name: Deploy to Ubuntu Server (Blue-Green)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: dev

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd /root/iwtDashboard

            # Determine which slot to use
            if [ "$(readlink IOTADashboard-active)" = "IOTADashboard-blue" ]; then
              NEXT="IOTADashboard-green"
              NEXT_PORT=8081
              APP_NAME="appDashboard-green"
            else
              NEXT="IOTADashboard-blue"
              NEXT_PORT=8080
              APP_NAME="appDashboard-blue"
            fi

            # Remove old and clone new
            rm -rf $NEXT
            git clone https://github.com/jaffe9/IOTADashboard.git $NEXT
            cd $NEXT
            git checkout dev
            git pull origin dev
            npm install

            # Update .env file with the correct PORT
            echo "PORT=$NEXT_PORT" > .env

            # ✅ Clear old PM2 process if any (avoids stale state)
            pm2 delete $APP_NAME || true

            # ✅ Start using updated .env + ecosystem file
            pm2 start ecosystem.config.cjs --only $APP_NAME

            # ✅ Wait for app to be up (adjust if needed)
            sleep 5

            # ✅ Health check (optional, can also curl localhost:$NEXT_PORT)
            if ! netstat -tulpn | grep ":$NEXT_PORT" > /dev/null; then
              echo "App failed to start on port $NEXT_PORT"
              exit 1
            fi

            # ✅ Switch symlink
            ln -sfn /root/iwtDashboard/$NEXT /root/iwtDashboard/IOTADashboard-active

            # ✅ Reload nginx or switch active backend
            /usr/local/bin/switch_backend_port.sh
          EOF
