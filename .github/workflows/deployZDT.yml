name: Deploy to Ubuntu Server (Blue-Green)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd /root/iwtDashboard

            # Determine which slot to use based on current nginx backend
            CURRENT_BACKEND_PORT=$(grep -o '[0-9]\{4\}' /etc/nginx/upstreams/active_backend.conf)
            
            if [ "$CURRENT_BACKEND_PORT" = "8080" ]; then
              NEXT="IOTADashboard-green"
              NEXT_PORT=8081
              APP_NAME="appDashboard-green"
              CURRENT_APP="appDashboard-blue"
              echo "🔄 Current backend: 8080 (blue) -> Deploying to: 8081 (green)"
            else
              NEXT="IOTADashboard-blue"
              NEXT_PORT=8080
              APP_NAME="appDashboard-blue"
              CURRENT_APP="appDashboard-green"
              echo "🔄 Current backend: 8081 (green) -> Deploying to: 8080 (blue)"
            fi

            echo "🚀 Deploying to $NEXT (port $NEXT_PORT)"

            # Clean and clone fresh
            rm -rf $NEXT
            git clone https://github.com/jaffe9/IOTADashboard.git $NEXT
            cd $NEXT
            git checkout dev
            git pull origin dev
            npm install

            # Create/update .env file with correct PORT
            echo "PORT=$NEXT_PORT" > .env
            ## echo "NODE_ENV=production" >> .env
            ## echo "NODE_ENV=development" >> .env
            echo "VITE_APP_BASE_LAYOUT_CONFIG_KEY=metronic-react-demo1-8150" >> .env
            echo "VITE_APP_API_URL=https://preview.keenthemes.com/metronic8/laravel/api" >> .env
            echo "VITE_APP_VERSION=v8.2.4" >> .env
            echo "VITE_APP_THEME_NAME=Metornic" >> .env
            echo "VITE_APP_THEME_DEMO=demo1" >> .env
            echo "VITE_APP_BOOTSTRAP_DOCS_LINK=https://getbootstrap.com/docs/5.0" >> .env
            echo "VITE_APP_SASS_PATH=src/_metronic/assets/sass/core/components" >> .env
            echo "VITE_APP_SASS_VARIABLES_PATH=src/_metronic/assets/sass/core/components/_variables.scss" >> .env
            echo "VITE_APP_PURCHASE_URL=https://themeforest.net/item/metronic-responsive-admin-dashboard-template/4021469" >> .env
            echo "VITE_APP_PREVIEW_URL=https://preview.keenthemes.com/metronic8/react/demo1/" >> .env
            echo "VITE_APP_PREVIEW_REACT_URL=https://preview.keenthemes.com/metronic8/react" >> .env
            echo "VITE_APP_PREVIEW_DOCS_URL=https://preview.keenthemes.com/metronic8/react/docs" >> .env
            echo "VITE_APP_THEME_API_URL=https://preview.keenthemes.com/theme-api/api" >> .env
            echo "VITE_PUBLIC_POSTHOG_KEY=phc_p5iOzCTGrxNdfjlQditba1ECZaTIZkmOk1cd0V06PCy" >> .env
            echo "VITE_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com" >> .env 

            # Add any other environment variables your app needs

            # Stop and delete previous process if it exists
            echo "🛑 Stopping previous $APP_NAME process..."
            pm2 delete $APP_NAME || true

            # Start new app
            echo "🚀 Starting $APP_NAME on port $NEXT_PORT..."
            pm2 start ecosystem.config.cjs --only $APP_NAME

            # Wait for app to start
            echo "⏳ Waiting for app to start..."
            sleep 10

            # Verify app is running and responding
            MAX_ATTEMPTS=30
            ATTEMPT=1
            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              if netstat -tulpn | grep ":$NEXT_PORT" > /dev/null; then
                echo "✅ Port $NEXT_PORT is listening"
                break
              fi
              echo "⏳ Waiting for port $NEXT_PORT to be ready (attempt $ATTEMPT/$MAX_ATTEMPTS)"
              sleep 2
              ((ATTEMPT++))
            done

            if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
              echo "❌ App failed to start on port $NEXT_PORT after $MAX_ATTEMPTS attempts"
              pm2 logs $APP_NAME --lines 50
              exit 1
            fi

            # Test if app is responding
            if ! curl -f -s -o /dev/null --max-time 10 http://localhost:$NEXT_PORT/; then
              echo "❌ App is not responding on port $NEXT_PORT"
              pm2 logs $APP_NAME --lines 50
              exit 1
            fi

            echo "✅ App is responding on port $NEXT_PORT"

            # Update symlink to point to the new deployment
            echo "🔗 Updating symlink to point to $NEXT..."
            ln -sfn /root/iwtDashboard/$NEXT /root/iwtDashboard/IOTADashboard-active
            echo "✅ Symlink now points to: $(readlink /root/iwtDashboard/IOTADashboard-active)"

            # Switch backend port in nginx (this script now includes health checks)
            echo "🔄 Switching nginx to port $NEXT_PORT..."
            /usr/local/bin/switch_backend_port.sh

            # Clean up - stop old app after successful switch
            echo "🧹 Cleaning up old deployment..."
            pm2 delete $CURRENT_APP || true

            echo "🎉 Blue-green deployment completed successfully!"
            echo "📊 Current PM2 status:"
            pm2 list
          EOF