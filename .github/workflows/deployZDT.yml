name: Deploy to Ubuntu Server (Blue-Green)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: dev

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd /root/iwtDashboard

            # ✅ Use full symlink path comparison-safe method
            CURRENT_ACTIVE=\$(basename "\$(readlink IOTADashboard-active)")
            if [ "\$CURRENT_ACTIVE" = "IOTADashboard-blue" ]; then
              NEXT="IOTADashboard-green"
              NEXT_PORT=8081
              APP_NAME="appDashboard-green"
            else
              NEXT="IOTADashboard-blue"
              NEXT_PORT=8080
              APP_NAME="appDashboard-blue"
            fi

            rm -rf \$NEXT
            git clone https://github.com/jaffe9/IOTADashboard.git \$NEXT
            cd \$NEXT
            git checkout dev
            git pull origin dev
            npm install

            # ✅ Update .env PORT value to match NEXT_PORT
            sed -i "s/^PORT=.*/PORT=\$NEXT_PORT/" .env

            npm run build

            pm2 startOrReload ecosystem.config.cjs --only \$APP_NAME
            pm2 restart \$APP_NAME

            ln -sfn /root/iwtDashboard/\$NEXT /root/iwtDashboard/IOTADashboard-active

            /usr/local/bin/switch_backend_port.sh
          EOF
